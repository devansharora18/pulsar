[package]
name = "pulsar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pulsar — a fast TUI system monitor with honest memory and per-app power."
default-run = "pulsar"

[[bin]]
name = "pulsar"
path = "src/main.rs"

[dependencies]
pulsar-core = { path = "../core" }
ratatui = "0.30"
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"

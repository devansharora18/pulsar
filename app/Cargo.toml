[package]
name = "pulsar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pulsar — a beautiful Linux system monitor built with Dioxus."
default-run = "pulsar"

[[bin]]
name = "pulsar"
path = "src/main.rs"

[dependencies]
pulsar-core = { path = "../core" }
dioxus = { version = "0.7", features = ["desktop"] }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
